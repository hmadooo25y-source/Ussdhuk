name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (zip or extracted)
        run: |
          echo "== Files in repo =="
          find . -path ./.git -prune -o -type f -print | head -n 60
          SETTINGS=$(find . -path ./.git -prune -o -name settings.gradle.kts -print | head -n 1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -path ./.git -prune -o -iname "*.zip" -print | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No zip file and no project found in the repository"
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p project
            unzip -q "$ZIP" -d project
            SETTINGS=$(find project -name settings.gradle.kts | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle.kts not found inside the zip"
              exit 1
            fi
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project root: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: UssdFlow-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
